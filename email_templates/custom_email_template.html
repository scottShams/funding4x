<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{$subject}</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            margin: 0;
            padding: 20px;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            background: linear-gradient(135deg, #4f009d 0%, #240046 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid #b49852;
        }
        .header-logo {
            display: inline-block;
            margin-bottom: 15px;
        }
        .header-logo img {
            height: 50px;
            width: auto;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0;
            color: #b49852;
        }
        .content {
            padding: 40px 30px;
            background-color: #f9fafb;
        }
        .footer {
            background-color: #240046;
            color: #b49852;
            padding: 30px 20px;
            text-align: center;
            font-size: 12px;
            border-top: 4px solid #b49852;
        }
        .footer p {
            margin: 8px 0;
        }
        .social-media {
            margin-top: 20px;
        }
        .social-links {
            display: inline-flex;
            gap: 15px;
            margin-top: 15px;
        }
        .social-link {
            color: #b49852;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #b49852;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        .social-link:hover {
            background-color: #b49852;
            color: #240046;
            transform: scale(1.1);
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .content {
                padding: 25px 15px;
            }
            .header {
                padding: 20px 15px;
            }
            .header h1 {
                font-size: 22px;
            }
            .footer {
                padding: 20px 15px;
            }
            .social-links {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <div class="header-logo">
                <img src="https://funding4x.com/assets/logo.png" alt="Funding4x Logo">
            </div>
            <h1>{$subject}</h1>
        </div>

        <!-- Main Content -->
        <div class="content">
            <div style="white-space: pre-line;">
                {$body}
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>This email was sent by Funding4x.</p>
            <p>If you have any questions, please contact our support team.</p>

            <div class="social-media">
                <p>Follow us on social media:</p>
                <div class="social-links">
                    <a href="https://www.youtube.com/channel/UCkosETo_p1wOaAx2g2B0jLA" class="social-link" target="_blank" title="YouTube">
                        <img src="https://funding4x.com/assets/icon/youtube.png"
                            width="24" height="24" alt="YouTube" style="display: block;">
                    </a>

                    <a href="https://t.me/funding4x" class="social-link" target="_blank" title="Telegram">
                        <img src="https://funding4x.com/assets/icon/telegram.png"
                            width="24" height="24" alt="Telegram" style="display: block;">
                    </a>

                    <a href="https://x.com/NasirFXTrader" class="social-link" target="_blank" title="X (Twitter)">
                        <img src="https://funding4x.com/assets/icon/images.png"
                            width="24" height="24" alt="X (Twitter)" style="display: block;">
                    </a>
                </div>

            </div>

            <p>&copy; 2024 Funding4x. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
